name: CI

on:
  push:
    branches: [master, main, "feat/**"]
  pull_request:

jobs:
  build-test-pack:
    # Windows is in the matrix because it is where the harness breaks in ways
    # ubuntu cannot see: process-tree teardown, MAX_PATH, and `rm -rf` in a
    # package script all pass here and fail there.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: npm pack --dry-run
        run: npm pack --dry-run

      # The tarball smoke exercises Corepack and Yarn 3's node-modules linker,
      # not harness behaviour, so one OS is enough signal for the runner minutes.
      # `npm run smoke:pack` does work on Windows — that is what the wrapper in
      # scripts/smoke-pack.mjs is for.
      - name: Enable Corepack (Yarn 3)
        if: runner.os == 'Linux'
        run: corepack enable

      - name: Tarball smoke (Yarn 3 node-modules)
        if: runner.os == 'Linux'
        run: npm run smoke:pack

  runtime-tiers:
    # SMOKE and EVALUATE need a browser, so they run in their own job rather than
    # adding Playwright download time to the main one.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Dev server, Playwright gate and validator against a fixture app
        run: npm run test:browser
