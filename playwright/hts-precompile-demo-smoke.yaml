name: hts-precompile-demo-smoke
description: Wallet-free browser smoke checks for the HTS precompile Solidity demo template.

server:
  command: yarn next:dev
  url: http://localhost:3000
  timeoutMs: 120000

artifacts:
  screenshots: true
  traces: true
  consoleErrors: true

defaults:
  timeoutMs: 60000
  failOnConsoleError: true
  requiresWallet: false
  requiresSecrets: false

routes:
  - name: home
    path: /
    assertions:
      visibleText:
        - HTS
        - Testnet

  - name: contract
    path: /contract
    assertions:
      visibleText:
        - Contract
        - Create
        - Mint

forbidden:
  visibleText:
    - Internal Server Error
    - Application error
    - Unhandled Runtime Error
