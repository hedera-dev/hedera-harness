name: hts-precompile-demo
description: Blind generation of an HTS precompile Solidity demo template (Hardhat + Next.js) from scaffold-hbar main.

prd: docs/prds/hts-precompile-demo.md
contract: contracts/hts-precompile-demo-acceptance.json

seed:
  repo: https://github.com/hedera-dev/scaffold-hbar.git
  ref: main
  preflight:
    commands:
      - name: seed-install
        command: yarn install
        timeoutMs: 300000
  isolation:
    neverModifySeedRepo: true

generator:
  provider: command
  command: agent
  args:
    - -p
    - --trust
    - --sandbox
    - enabled
    - --workspace
    - "{workspace}"
    - --model
    - composer-2.5
    - --force
    - --output-format
    - stream-json
    - --stream-partial-output
  timeoutMs: 3600000

validator:
  enabled: true
  provider: command
  command: agent
  args:
    - -p
    - --trust
    - --force
    - --sandbox
    - disabled
    - --approve-mcps
    - --workspace
    - "{workspace}"
    - --model
    - composer-2.5
    - --output-format
    - stream-json
    - --stream-partial-output
  timeoutMs: 600000

# Skill names resolve via skills-index.json at the harness repo root.
skills:
  - project-scaffolding
  - quality-gates
  - session-management
  - hedera-token-service
  - hts-system-contract

constraints:
  packageManager: yarn@3.2.3
  workspaces:
    - packages/nextjs
    - packages/hardhat
  forbiddenWorkspaces:
    - packages/foundry
  forbiddenCommands:
    - npm install
    - npm run
    - pnpm install
    - pnpm run
    - yarn foundry:*
    - docker *

templateMetadata:
  name: hts-precompile-demo
  frontend: nextjs-app
  solidityFramework: hardhat

validators:
  static: validators/hts-precompile-demo-static.json
  commands: validators/hts-precompile-demo-yarn.json
  playwright: playwright/hts-precompile-demo-smoke.yaml

requiredFiles:
  - template.json
  - README.md
  - AGENTS.md
  - package.json
  - packages/nextjs/package.json
  - packages/hardhat/package.json
  - packages/hardhat/hardhat.config.ts
  - packages/hardhat/contracts/HtsTokenCreator.sol

forbiddenFiles:
  - .env
  - packages/nextjs/.env
  - packages/hardhat/.env
  - packages/foundry

secretScan:
  failOnFiles:
    - .env
    - packages/nextjs/.env
    - packages/hardhat/.env
  patterns:
    - name: private-key-assignment
      pattern: "(PRIVATE_KEY|OPERATOR_KEY|HEDERA_OPERATOR_PRIVATE_KEY)\\s*=\\s*(0x)?[0-9a-fA-F]{32,}"
    - name: api-key-assignment
      pattern: "(API_KEY|TOKEN|SECRET)\\s*=\\s*['\\\"]?[A-Za-z0-9_\\-]{24,}"

# Tier 3.5 — on-chain validation via ephemeral ECDSA test signer + mirror node.
# Requires host env: HEDERA_OPERATOR_ID and HEDERA_OPERATOR_KEY (testnet ECDSA).
# Deploy injects __RUNTIME_DEPLOYER_PRIVATE_KEY for non-interactive Hardhat deploy.
chainValidation:
  enabled: true
  network: testnet
  operator:
    accountIdEnv: HEDERA_OPERATOR_ID
    privateKeyEnv: HEDERA_OPERATOR_KEY
  # Enough for deploy gas + one createToken msg.value (~15–25 HBAR testnet fee) + mint + buffer.
  # Reused signers on --continue are topped up to this balance when low.
  fundingHbar: 40
  sweepBack: true
  deploy:
    commands:
      - name: compile
        command: yarn hardhat:compile
        timeoutMs: 180000
      - name: deploy-testnet
        # Bypass interactive runHardhatDeployWithPK.ts; use __RUNTIME_DEPLOYER_PRIVATE_KEY from expose.envVars.
        # Deploy must stay cheap (no large contract prefund) — create fee is paid via msg.value from the burner.
        command: yarn workspace @sh/hardhat hardhat deploy --network hederaTestnet
        timeoutMs: 300000
  expose:
    browserLocalStorageKey: burnerWallet.pk
    envVars:
      - __RUNTIME_DEPLOYER_PRIVATE_KEY

maxAttempts: 3

logging:
  jsonl: runs/harness.log.jsonl
  notes: runs/harness-notes.md
