<svg xmlns="http://www.w3.org/2000/svg" width="960" height="780" viewBox="0 0 960 780" role="img" aria-labelledby="title desc">
  <title id="title">hedera-harness run sequence</title>
  <desc id="desc">Sequence diagram of a harness run: CLI, Harness, Git sources, Workspace, Generator, and Validators.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="780" rx="8" fill="#ffffff"/>
  <rect x="16" y="16" width="928" height="748" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>

  <text x="40" y="52" fill="#0f172a" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700">hedera-harness run sequence</text>
  <text x="40" y="72" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">Solid = request | Dashed = response | Self-loop = internal step</text>

  <!-- CLI -->
  <rect x="40" y="96" width="100" height="36" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.25"/>
  <text x="90" y="118" text-anchor="middle" fill="#1e1b4b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">CLI / User</text>
  <line x1="90" y1="132" x2="90" y2="700" stroke="#cbd5e1" stroke-width="1.25" stroke-dasharray="4 4"/>

  <!-- Harness -->
  <rect x="190" y="96" width="100" height="36" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.25"/>
  <text x="240" y="118" text-anchor="middle" fill="#1e1b4b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Harness</text>
  <line x1="240" y1="132" x2="240" y2="700" stroke="#cbd5e1" stroke-width="1.25" stroke-dasharray="4 4"/>
  <rect x="234" y="160" width="12" height="520" rx="2" fill="#c7d2fe" stroke="#6366f1"/>

  <!-- Git -->
  <rect x="330" y="96" width="120" height="36" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.25"/>
  <text x="390" y="118" text-anchor="middle" fill="#1e1b4b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Git sources</text>
  <line x1="390" y1="132" x2="390" y2="700" stroke="#cbd5e1" stroke-width="1.25" stroke-dasharray="4 4"/>

  <!-- Workspace -->
  <rect x="490" y="96" width="100" height="36" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.25"/>
  <text x="540" y="118" text-anchor="middle" fill="#1e1b4b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Workspace</text>
  <line x1="540" y1="132" x2="540" y2="700" stroke="#cbd5e1" stroke-width="1.25" stroke-dasharray="4 4"/>

  <!-- Generator -->
  <rect x="640" y="96" width="100" height="36" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.25"/>
  <text x="690" y="118" text-anchor="middle" fill="#1e1b4b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Generator</text>
  <line x1="690" y1="132" x2="690" y2="700" stroke="#cbd5e1" stroke-width="1.25" stroke-dasharray="4 4"/>

  <!-- Validators -->
  <rect x="790" y="96" width="100" height="36" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.25"/>
  <text x="840" y="118" text-anchor="middle" fill="#1e1b4b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">Validators</text>
  <line x1="840" y1="132" x2="840" y2="700" stroke="#cbd5e1" stroke-width="1.25" stroke-dasharray="4 4"/>

  <!-- START -->
  <text x="40" y="156" fill="#4f46e5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700">START</text>
  <line x1="96" y1="170" x2="232" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="164" y="164" text-anchor="middle" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500">run(spec.yaml)</text>

  <!-- SEED -->
  <text x="40" y="200" fill="#4f46e5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700">SEED</text>
  <line x1="246" y1="214" x2="384" y2="214" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="315" y="208" text-anchor="middle" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500">clone scaffold-hbar @ ref</text>
  <line x1="384" y1="238" x2="246" y2="238" stroke="#64748b" stroke-width="1.35" stroke-dasharray="5 3" marker-end="url(#arrowMuted)"/>
  <text x="315" y="232" text-anchor="middle" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500">checkout ready</text>
  <line x1="246" y1="262" x2="534" y2="262" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="256" text-anchor="middle" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500">materialize + yarn preflight</text>
  <line x1="534" y1="286" x2="246" y2="286" stroke="#64748b" stroke-width="1.35" stroke-dasharray="5 3" marker-end="url(#arrowMuted)"/>
  <text x="390" y="280" text-anchor="middle" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500">workspace ready</text>

  <!-- VENDOR -->
  <text x="40" y="316" fill="#4f46e5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700">VENDOR</text>
  <line x1="246" y1="330" x2="384" y2="330" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="315" y="324" text-anchor="middle" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500">fetch hedera-skills</text>
  <line x1="384" y1="354" x2="246" y2="354" stroke="#64748b" stroke-width="1.35" stroke-dasharray="5 3" marker-end="url(#arrowMuted)"/>
  <text x="315" y="348" text-anchor="middle" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500">SKILL.md paths</text>
  <line x1="246" y1="378" x2="534" y2="378" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="372" text-anchor="middle" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500">vendor skills + PRD / context</text>

  <!-- GENERATE -->
  <text x="40" y="408" fill="#4f46e5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700">GENERATE</text>
  <line x1="246" y1="422" x2="684" y2="422" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="465" y="416" text-anchor="middle" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500">generate from PRD</text>
  <line x1="690" y1="446" x2="546" y2="446" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="618" y="440" text-anchor="middle" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500">write template files</text>
  <line x1="684" y1="470" x2="246" y2="470" stroke="#64748b" stroke-width="1.35" stroke-dasharray="5 3" marker-end="url(#arrowMuted)"/>
  <text x="465" y="464" text-anchor="middle" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500">exit / stream done</text>

  <!-- VALIDATE -->
  <text x="40" y="500" fill="#4f46e5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700">VALIDATE</text>
  <path d="M 246 514 L 286 514 L 286 530 L 246 530" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="294" y="526" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500">oracle audit (informational)</text>

  <line x1="246" y1="550" x2="834" y2="550" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="544" text-anchor="middle" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500">Tier 0-1 deterministic</text>
  <line x1="840" y1="574" x2="546" y2="574" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="693" y="568" text-anchor="middle" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500">assert files / yarn / secrets</text>
  <line x1="834" y1="598" x2="246" y2="598" stroke="#64748b" stroke-width="1.35" stroke-dasharray="5 3" marker-end="url(#arrowMuted)"/>
  <text x="540" y="592" text-anchor="middle" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500">pass / fail</text>

  <line x1="246" y1="622" x2="834" y2="622" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="616" text-anchor="middle" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500">Tier 2 Playwright (if enabled)</text>
  <line x1="834" y1="646" x2="246" y2="646" stroke="#64748b" stroke-width="1.35" stroke-dasharray="5 3" marker-end="url(#arrowMuted)"/>
  <text x="540" y="640" text-anchor="middle" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500">pass / fail</text>

  <line x1="246" y1="670" x2="834" y2="670" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="664" text-anchor="middle" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500">Tier 3 semantic (+ 3.5 if on)</text>
  <line x1="834" y1="694" x2="246" y2="694" stroke="#64748b" stroke-width="1.35" stroke-dasharray="5 3" marker-end="url(#arrowMuted)"/>
  <text x="540" y="688" text-anchor="middle" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500">pass / fail / infra abort</text>

  <!-- FINISH -->
  <text x="40" y="720" fill="#4f46e5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700">FINISH</text>
  <line x1="234" y1="734" x2="96" y2="734" stroke="#64748b" stroke-width="1.35" stroke-dasharray="5 3" marker-end="url(#arrowMuted)"/>
  <text x="164" y="728" text-anchor="middle" fill="#334155" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500">report + runs/ artifacts</text>

  <text x="40" y="756" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10">Git sources = scaffold-hbar (seed) + hedera-skills (skills). Repair / abort branches omitted for clarity.</text>
</svg>
